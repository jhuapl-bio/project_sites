- name: Environmental Genomics
  description: Tools and workflows for environmental DNA and RNA analysis, including metagenomics and metabarcoding, ecological data integration, and field-forward sequencing applications.
  icon: "⌁"
  projects:
    - name: eDNA Metadata Collection
      description: FAIRe-compliant metadata collection, physical sample barcoding, and shipboard system integration. Mapping of sampling campaigns for cruise reports.
      url: https://github.com/jhuapl-bio/eDNA_automated_metadata
      tags: [eDNA, metagenomics]
    - name: Exploratory eDNA Dashboard
      description: Tools for turning marine eDNA taxonomic results into interactive, map-based HTML reports and a queryable Postgres database. 
      url: https://github.com/jhuapl-bio/eDNA_processing
      tags: [eDNA, metagenomics]
    - name: Field-Forward Sequencing
      description: MyTax2: Real-time dashboard for metagenomic taxonomic analysis.
      url: https://github.com/jhuapl-bio/mytax
      tags: [eDNA, metagenomics, dashboard, Illumina, ONT]
- name: Infectious Disease Surveillance
  description: Genomic and metagenomic software for pathogen detection, characterization, and biosurveillance.
  icon: "+"
  projects:
    - name: TaxTriage
      description: Software supporting Oxford Nanopore sequencing analysis workflows.
      url: https://github.com/jhuapl-bio/taxtriage
      tags: [Nextflow, Agnostics Detection, Reporting, Illumina, ONT]
    - name: Basestack
      description: Platform for rapid and real-time analysis of next-generation sequencing data.
      url: https://github.com/jhuapl-bio/Basestack
      tags: [NGS, surveillance]
    - name: ONT-DART
      description: Software supporting Oxford Nanopore sequencing analysis workflows.
      url: https://github.com/jhuapl-bio/ONT-DART
      tags: [Nanopore, sequencing]
